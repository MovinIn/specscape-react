server {
    listen 80;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets: cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy to the REST API. In production the server in front of this
    # container may handle /api itself; this is the fallback.
    # Resolved lazily (variable + resolver) so nginx still starts if the API
    # host is not reachable yet.
    location /api/ {
        resolver           ${NGINX_LOCAL_RESOLVERS} valid=10s;
        resolver_timeout   2s;
        set                $api_upstream ${API_UPSTREAM};
        rewrite            ^/api/(.*)$ ${API_PATH}$1 break;
        proxy_pass         $api_upstream;
        proxy_redirect     off;
        proxy_set_header   Host ${API_HOST};
        proxy_ssl_server_name on;
        proxy_cookie_flags ${COOKIE_FLAGS};
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $server_name;
    }

    # React Router (BrowserRouter): fall back to index.html for client routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
